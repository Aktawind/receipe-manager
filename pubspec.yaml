name: recettes
description: "Gestionnaire de recettes de cuisine"
publish_to: 'none'

# Version visible (x.y.z). Le versionCode Android est calculé par la CI :
# voir .github/workflows/ et docs/decisions/0003-workflow-git-et-versions.md
version: 0.0.1+1

environment:
  sdk: ^3.13.5
  # Version exacte de Flutter, lue aussi par la CI (flutter-version-file).
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

name: recettes
description: "Gestionnaire de recettes de cuisine"
publish_to: 'none'

# Version visible (x.y.z). Le versionCode Android est calculé par la CI :
# voir .github/workflows/ et docs/decisions/0003-workflow-git-et-versions.md
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  # Version exacte de Flutter, lue aussi par la CI (flutter-version-file).
  flutter: 3.47.7

dependencies:
  archive: ^4.5.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  html: ^0.15.7
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true

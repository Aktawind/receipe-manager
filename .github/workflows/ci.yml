name: CI

# Vérifie chaque PR et chaque envoi sur develop : analyse, tests, compilation et
# démarrage sur émulateur. Plus de version de test publiée depuis le 2026-11-18
# (docs/decisions/0005) : chaque correction validée part directement en release.
on:
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  push:
    branches: [develop]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  apk:
    name: APK de test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          android: "true"

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secrets de signature absents : APK signé avec une clé de debug (pas de mise à jour possible par-dessus)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # arm64 : l'APK publié (tous les appareils récents).
      # x86_64 : uniquement pour le test de démarrage sur émulateur.
      - name: Compilation
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor dev \
            --target-platform android-arm64,android-x64 --split-per-abi \
            --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-arm64-v8a-dev-release.apk recettes-test.apk
          mv build/app/outputs/flutter-apk/app-x86_64-dev-release.apk recettes-test-x86_64.apk

      - name: Vérifier que tous les plugins sont dans l'APK
        run: tools/check_apk_plugins.sh devRelease

      - uses: actions/upload-artifact@v5
        with:
          name: recettes-test-${{ github.run_number }}
          path: recettes-test.apk
          retention-days: 14

      - uses: actions/upload-artifact@v5
        with:
          name: recettes-test-x86_64-${{ github.run_number }}
          path: recettes-test-x86_64.apk
          retention-days: 3

  smoke:
    name: Démarrage sur émulateur
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: recettes-test-x86_64-${{ github.run_number }}
      - uses: ./.github/actions/emulator-smoke-test
        with:
          apk: recettes-test-x86_64.apk
          package: io.github.aktawind.recettes.dev

name: Release

# Publie une version validée. Deux façons de la lancer :
# - Actions → Release → « Run workflow » depuis main, avec le numéro (ex. 0.1.0) :
#   le workflow pose lui-même le tag vX.Y.Z sur main ;
# - ou en poussant un tag vX.Y.Z sur main.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version, sans le v (ex. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          android: "true"

      - run: flutter analyze
      - run: flutter test

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Une release se lance depuis main."
              exit 1
            fi
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Numéro de version invalide : $version"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          # versionCode croissant : 0.4.2 -> 4002, 1.2.0 -> 1002000
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Les secrets de signature sont obligatoires pour une release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # APK universel : un seul fichier qui fonctionne sur tous les appareils.
      - name: Compilation
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor prod \
            --build-name="$VERSION" --build-number="$VERSION_CODE"
          mv build/app/outputs/flutter-apk/app-prod-release.apk "recettes-$VERSION.apk"

      - name: Vérifier que tous les plugins sont dans l'APK
        run: tools/check_apk_plugins.sh prodRelease

      - uses: ./.github/actions/emulator-smoke-test
        with:
          apk: recettes-${{ env.VERSION }}.apk
          package: io.github.aktawind.recettes

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/v$VERSION.md"
          [ -f "$notes" ] || { echo "::error::Notes de version manquantes : $notes"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" "recettes-$VERSION.apk" \
            --title "$TAG" --notes-file "$notes" --verify-tag

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Kotlin intégré à AGP 9 : avec `false`, le Kotlin des plugins (ex. package_info_plus) n'était
# pas compilé, l'enregistrement des plugins échouait et l'app restait bloquée au démarrage.
# La CI vérifie que chaque plugin est bien présent dans l'APK (tools/check_apk_plugins.sh).
android.builtInKotlin=true
# Accélère les compilations (cache Gradle, réutilisé par la CI)
org.gradle.caching=true
org.gradle.parallel=true
